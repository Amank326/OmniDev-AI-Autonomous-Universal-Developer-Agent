version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: omnidev-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-omnidev_db}
      POSTGRES_USER: ${DB_USER:-omnidev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-omnidev_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnidev-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: omnidev-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_change_me}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnidev-network

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: omnidev-backend
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-omnidev_user}:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/${DB_NAME:-omnidev_db}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_change_me}@redis:6379/0
      
      # Application
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      
      # Email Configuration
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
    volumes:
      - ../backend:/app
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - omnidev-network
    command: >
      sh -c "
        python -m alembic upgrade head &&
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  # Celery Worker for Background Jobs
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: omnidev-celery-worker
    environment:
      DATABASE_URL: postgresql://${DB_USER:-omnidev_user}:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/${DB_NAME:-omnidev_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_change_me}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ../backend:/app
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - omnidev-network
    command: celery -A app.scheduler.tasks worker --loglevel=info

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: omnidev-celery-beat
    environment:
      DATABASE_URL: postgresql://${DB_USER:-omnidev_user}:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/${DB_NAME:-omnidev_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_change_me}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ../backend:/app
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - omnidev-network
    command: celery -A app.scheduler.tasks beat --loglevel=info

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: omnidev-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - omnidev-network

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: omnidev-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - omnidev-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: omnidev-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - omnidev-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  nginx_logs:

networks:
  omnidev-network:
    driver: bridge

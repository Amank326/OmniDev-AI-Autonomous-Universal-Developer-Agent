name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Extract metadata
      id: meta
      run: |
        IMAGE_NAME="${{ github.repository }}"
        VERSION="${{ github.ref }}"
        if [[ $VERSION == refs/tags/* ]]; then
          VERSION=${VERSION#refs/tags/}
        else
          VERSION=${VERSION#refs/heads/}
        fi
        echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/Dockerfile
        push: false
        tags: |
          ${{ steps.meta.outputs.image_name }}:latest
          ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
        outputs: type=docker,dest=/tmp/image.tar
    
    - name: Upload image artifact
      uses: actions/upload-artifact@v3
      with:
        name: docker-image
        path: /tmp/image.tar
        retention-days: 1
    
    - name: Test Docker image
      run: |
        docker load --input /tmp/image.tar
        docker run --rm ${{ steps.meta.outputs.image_name }}:latest --version || true

  push:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Extract metadata
      id: meta
      run: |
        IMAGE_NAME="${{ github.repository }}"
        VERSION="${{ github.ref }}"
        if [[ $VERSION == refs/tags/* ]]; then
          VERSION=${VERSION#refs/tags/}
        else
          VERSION=${VERSION#refs/heads/}
        fi
        echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Build and push to Docker Hub
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/Dockerfile
        push: ${{ secrets.DOCKER_USERNAME != '' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/omnidev-ai:latest
          ${{ secrets.DOCKER_USERNAME }}/omnidev-ai:${{ steps.meta.outputs.version }}
    
    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}

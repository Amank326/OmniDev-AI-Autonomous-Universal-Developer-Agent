version: '3.8'

# ============================================================
# OmniDev AI — Production Docker Compose (Standalone)
# ============================================================
# Usage:
#   cp .env.production .env
#   # Edit .env and fill in all required values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env vars: POSTGRES_PASSWORD, SECRET_KEY, DOMAIN
# ============================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: omnidev-postgres-prod
    environment:
      POSTGRES_USER: omnidev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: omnidev
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnidev -d omnidev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - omnidev-prod

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: omnidev-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-redisprod123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisprod123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - omnidev-prod

  # ── Backend (FastAPI) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: omnidev-backend-prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://omnidev:${POSTGRES_PASSWORD}@postgres:5432/omnidev
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisprod123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redisprod123}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redisprod123}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ENVIRONMENT=production
      - CORS_ORIGINS=${CORS_ORIGINS:-https://omnidev.ai,https://www.omnidev.ai}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - omnidev-prod

  # ── Frontend (Next.js Standalone) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${API_URL:-https://api.omnidev.ai}
        - NEXT_PUBLIC_WS_URL=${WS_URL:-wss://api.omnidev.ai/ws}
        - NEXT_PUBLIC_APP_NAME=OmniDev AI
    container_name: omnidev-frontend-prod
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - omnidev-prod

  # ── Celery Worker ───────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: omnidev-worker-prod
    command: celery -A app.utils.celery_app:celery_app worker --loglevel=info -Q agent-queue,notification-queue --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://omnidev:${POSTGRES_PASSWORD}@postgres:5432/omnidev
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisprod123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redisprod123}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redisprod123}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - omnidev-prod

  # ── Celery Beat (Scheduler) ────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: omnidev-beat-prod
    command: celery -A app.utils.celery_app:celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://omnidev:${POSTGRES_PASSWORD}@postgres:5432/omnidev
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisprod123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redisprod123}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redisprod123}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - omnidev-prod

  # ── Nginx (Reverse Proxy) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: omnidev-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL:
      # - ./ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      # - ./ssl/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - omnidev-prod

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  omnidev-prod:
    driver: bridge
